<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10261c"><title>ダビスタSwitch 牧場DB</title><style>:root{--g:#174c35;--l:#dce2dd;--m:#66736c;--gold:#9a7418}*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#17221d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{background:linear-gradient(135deg,#10261c,#1f5a40);color:#fff;padding:16px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}.sub,.muted{font-size:12px;color:var(--m)}header .sub{color:#d7e4dc}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.headbtns{display:flex;gap:5px}.headbtn{border:1px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px}.ver{font-size:11px;color:#d7e4dc;margin-top:5px}.updatebar{display:none;background:#fff3cd;color:#594700;padding:9px 12px;font-size:12px}.updatebar.show{display:flex;justify-content:space-between;align-items:center;gap:8px}.wrap{max-width:760px;margin:auto;padding:12px 12px 92px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}.tab,.secondary{border:1px solid var(--l);background:#fff;border-radius:11px;padding:10px 5px}.tab.on,.primary{background:var(--g);color:#fff;border:0}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:14px;margin-bottom:10px}.row,.toolbar,.actions{display:flex;gap:7px;align-items:center}.row{justify-content:space-between}.toolbar input{flex:1}.horse h2{font-size:19px;margin:0}.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#e8efe9;margin:4px 3px 0 0}.gold{background:#f3ead0;color:#674b00}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#f6f7f4;border-radius:9px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat small{color:var(--m)}button,input,select,textarea{font:inherit}.primary{border-radius:11px;padding:10px 13px;font-weight:600}.toolbar input,input,select,textarea{border:1px solid var(--l);border-radius:10px;padding:10px;font-size:16px;background:#fff}.score{font-size:20px;font-weight:700;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 3px;border-bottom:1px solid var(--l);text-align:center}th:first-child,td:first-child{text-align:left}.mark{font-size:19px;font-weight:700}.fab{position:fixed;right:18px;bottom:22px;border:0;border-radius:50%;width:58px;height:58px;background:var(--g);color:#fff;font-size:29px}.hidden{display:none}dialog{border:0;border-radius:17px;width:min(94vw,600px);padding:0}dialog::backdrop{background:#0007}.form{padding:17px}.form h2{margin-top:0}.form label{display:block;font-size:12px;color:var(--m);margin:9px 0 4px}.form input,.form select,.form textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions{justify-content:flex-end;margin-top:14px}.empty{text-align:center;padding:25px;color:var(--m)}.breaker{border-left:5px solid var(--gold)}</style></head><body><header><div class="headrow"><div><h1>ダビスタSwitch 牧場DB</h1><div class="ver" id="ver"></div></div><div class="headbtns"><button class="headbtn" id="refreshBtn">↻ 更新</button><button class="headbtn" id="diagBtn">診断JSON</button></div></div><div class="sub">高SPを守りながら、バランサーを突破する個体を探す</div></header><div id="updatebar" class="updatebar"><span id="updateText"></span><button class="primary" id="applyUpdate">最新版へ</button></div><main class="wrap"><div class="tabs"><button class="tab on" data-tab="horses">馬DB</button><button class="tab" data-tab="races">印・距離</button><button class="tab" data-tab="breed">配合</button><button class="tab" data-tab="backup">保存</button></div><section id="horses"><div class="toolbar"><input id="search" placeholder="馬名・父・母を検索"><button class="primary" id="photoBtn">画像</button><input id="photo" type="file" accept="image/*" multiple hidden></div><div id="horseList"></div></section><section id="races" class="hidden"><div class="card"><b>距離・印から能力を追跡</b><p class="muted">4番目＝高SP維持、5番目＝距離対応を含む総合力の手掛かり。勝敗だけで認定しません。</p><button class="primary" id="addRace">＋ レース記録</button></div><div id="raceCards"></div></section><section id="breed" class="hidden"><div class="card"><b>配合検討メモ</b><p class="muted">凱旋門／後継種牡馬／血統再構築ラインを記録。</p><textarea id="breedMemo" rows="10" style="width:100%"></textarea><div class="actions"><button class="primary" id="saveMemo">保存</button></div></div></section><section id="backup" class="hidden"><div class="card"><b>データ保存</b><p class="muted">バックアップJSONは復元用。診断JSONは不具合調査用です。</p><button class="primary" id="exportBtn">バックアップJSON</button> <button class="secondary" id="importBtn">読み込む</button><input id="importFile" type="file" accept="application/json" hidden></div></section></main><button class="fab" id="addBtn">＋</button><dialog id="horseDlg"><form class="form" id="horseForm"><h2>馬を登録</h2><input type="hidden" id="editId"><label>馬名</label><input id="name" required><div class="two"><div><label>性別</label><select id="sex"><option>牡</option><option>牝</option></select></div><div><label>世代・分類</label><input id="generation"></div></div><div class="two"><div><label>父</label><input id="sire"></div><div><label>母</label><input id="dam"></div></div><div class="two"><div><label>距離下限</label><input id="minD" type="number" step="100"></div><div><label>距離上限</label><input id="maxD" type="number" step="100"></div></div><div class="three"><div><label>実績</label><select id="record"><option>-</option><option>A</option><option>B</option><option>C</option></select></div><div><label>底力</label><select id="guts"><option>-</option><option>A</option><option>B</option><option>C</option></select></div><div><label>安定</label><select id="stable"><option>-</option><option>A</option><option>B</option><option>C</option></select></div></div><div class="two"><div><label>戦績</label><input id="starts"></div><div><label>主なG1</label><input id="g1"></div></div><label>評価・メモ</label><textarea id="note" rows="3"></textarea><div class="actions"><button type="button" class="secondary" onclick="horseDlg.close()">取消</button><button class="primary">保存</button></div></form></dialog><dialog id="raceDlg"><form class="form" id="raceForm"><h2>レース記録</h2><label>馬</label><select id="raceHorse" required></select><div class="two"><div><label>レース名</label><input id="raceName" required></div><div><label>距離(m)</label><input id="raceDistance" type="number" step="100" required></div></div><div class="two"><div><label>4番目</label><select id="mark4"><option>◎</option><option>○</option><option>▲</option><option>△</option><option>－</option><option>不明</option></select></div><div><label>5番目</label><select id="mark5"><option>◎</option><option>○</option><option>▲</option><option>△</option><option>－</option><option>不明</option></select></div></div><div class="two"><div><label>着順</label><input id="finish" type="number"></div><div><label>人気</label><input id="popularity" type="number"></div></div><label>メモ</label><textarea id="raceNote" rows="3"></textarea><div class="actions"><button type="button" class="secondary" onclick="raceDlg.close()">取消</button><button class="primary">保存</button></div></form></dialog><script>
const APP_VERSION='1.3.0',APP_BUILD='2026.09.15-19',KEY='dabistaFarmV1',errors=[];let updateState={lastCheck:null,status:'not-checked',remote:null};window.addEventListener('error',e=>errors.push({at:new Date().toISOString(),message:e.message,source:e.filename,line:e.lineno,col:e.colno}));window.addEventListener('unhandledrejection',e=>errors.push({at:new Date().toISOString(),message:String(e.reason)}));
const seed={horses:[{id:'inari-shuttle',name:'イナリシャトル',sex:'牡',generation:'基準種牡馬',sire:'バゴ',dam:'イナリワルツ',minD:1000,maxD:1200,record:'A',guts:'A',stable:'C',starts:'30戦12勝',g1:'',note:'G1馬を量産した高SP基準馬。代表産駒：イナリガーデン（ジャパンC）、イナリララバイ（宝塚記念）、イナリミッキー（宝塚記念）。'}],races:[],memo:''};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;db.races=db.races||[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));save();$('#ver').textContent=`v${APP_VERSION} / Build ${APP_BUILD}`;
function score(id){let r=db.races.filter(x=>x.horseId===id&&x.distance>=2000&&x.distance<=2400),v={'◎':5,'○':4,'▲':3,'△':2,'－':1,'不明':0};if(!r.length)return null;let a=r.reduce((s,x)=>s+(v[x.mark4]||0),0)/r.length,b=r.reduce((s,x)=>s+(v[x.mark5]||0),0)/r.length,l=a>=4.5&&b>=4?'ブレイカー有力':a>=4.5&&b>=3?'高SP・ST残存候補':a>=4.5?'SP押し切り型':b>=4?'ST寄り':'要データ';return{a,b,l,n:r.length}}
function renderH(){let q=$('#search').value.toLowerCase(),a=db.horses.filter(h=>[h.name,h.sire,h.dam].join(' ').toLowerCase().includes(q));$('#horseList').innerHTML=a.map(h=>{let s=score(h.id);return`<article class="card horse" data-id="${h.id}"><div class="row"><div><h2>${esc(h.name)}</h2><span class="badge">${h.sex}</span><span class="badge gold">${esc(h.generation||'登録馬')}</span>${s?`<span class="badge">${s.l}</span>`:''}</div><div class="score">${h.minD&&h.maxD?h.minD+'–'+h.maxD:'—'}</div></div><p class="muted">${esc(h.sire||'?')} × ${esc(h.dam||'?')}</p><div class="grid"><div class="stat"><b>${h.record||'-'}</b><small>実績</small></div><div class="stat"><b>${h.guts||'-'}</b><small>底力</small></div><div class="stat"><b>${h.stable||'-'}</b><small>安定</small></div></div>${s?`<p class="muted">2000–2400m ${s.n}走｜④ ${s.a.toFixed(1)}｜⑤ ${s.b.toFixed(1)}</p>`:''}${h.starts?`<p><b>${esc(h.starts)}</b> ${esc(h.g1||'')}</p>`:''}${h.note?`<p class="muted">${esc(h.note)}</p>`:''}</article>`}).join('')||'<div class="empty">登録馬なし</div>'}
function renderR(){let g=db.horses.map(h=>({h,r:db.races.filter(x=>x.horseId===h.id)})).filter(x=>x.r.length);$('#raceCards').innerHTML=g.map(x=>{let s=score(x.h.id);return`<div class="card ${s?.l==='ブレイカー有力'?'breaker':''}"><div class="row"><b>${esc(x.h.name)}</b><span class="score">${s?s.a.toFixed(1)+' / '+s.b.toFixed(1):''}</span></div><div class="muted">${s?.l||''}</div><table><tr><th>レース</th><th>距離</th><th>④</th><th>⑤</th><th>着</th><th></th></tr>${x.r.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.distance}</td><td class="mark">${r.mark4}</td><td class="mark">${r.mark5}</td><td>${r.finish||'-'}</td><td><button class="secondary" data-del="${r.id}">削除</button></td></tr>`).join('')}</table></div>`}).join('')||'<div class="empty">レース記録なし</div>'}renderH();renderR();$('#search').oninput=renderH;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['horses','races','breed','backup'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==b.dataset.tab));$('#addBtn').style.display=b.dataset.tab==='horses'?'block':'none'});$('#addBtn').onclick=()=>{$('#horseForm').reset();$('#editId').value='';horseDlg.showModal()};$('#horseForm').onsubmit=e=>{e.preventDefault();let id=$('#editId').value||crypto.randomUUID(),h={id,name:$('#name').value,sex:$('#sex').value,generation:$('#generation').value,sire:$('#sire').value,dam:$('#dam').value,minD:+$('#minD').value||'',maxD:+$('#maxD').value||'',record:$('#record').value,guts:$('#guts').value,stable:$('#stable').value,starts:$('#starts').value,g1:$('#g1').value,note:$('#note').value},i=db.horses.findIndex(x=>x.id===id);i<0?db.horses.push(h):db.horses[i]=h;save();renderH();horseDlg.close()};$('#horseList').onclick=e=>{let c=e.target.closest('[data-id]');if(!c)return;let h=db.horses.find(x=>x.id===c.dataset.id);Object.entries({editId:h.id,name:h.name,sex:h.sex,generation:h.generation,sire:h.sire,dam:h.dam,minD:h.minD,maxD:h.maxD,record:h.record,guts:h.guts,stable:h.stable,starts:h.starts,g1:h.g1,note:h.note}).forEach(([k,v])=>$('#'+k).value=v??'');horseDlg.showModal()};$('#addRace').onclick=()=>{$('#raceForm').reset();$('#raceHorse').innerHTML=db.horses.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');raceDlg.showModal()};$('#raceForm').onsubmit=e=>{e.preventDefault();db.races.push({id:crypto.randomUUID(),horseId:$('#raceHorse').value,name:$('#raceName').value,distance:+$('#raceDistance').value,mark4:$('#mark4').value,mark5:$('#mark5').value,finish:+$('#finish').value||'',popularity:+$('#popularity').value||'',note:$('#raceNote').value});save();renderR();renderH();raceDlg.close()};$('#raceCards').onclick=e=>{let id=e.target.dataset.del;if(id&&confirm('削除しますか？')){db.races=db.races.filter(r=>r.id!==id);save();renderR();renderH()}};$('#breedMemo').value=db.memo||'';$('#saveMemo').onclick=()=>{db.memo=$('#breedMemo').value;save();alert('保存しました')};$('#photoBtn').onclick=()=>$('#photo').click();$('#photo').onchange=e=>alert(`${e.target.files.length}枚選択しました。画像解析は次段階で追加します。`);
function downloadJSON(obj,name){let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#exportBtn').onclick=()=>downloadJSON(db,'dabista-farm-backup.json');$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.horses))throw Error('horses missing');db=x;db.races=db.races||[];save();renderH();renderR();$('#breedMemo').value=db.memo||'';alert('復元しました')}catch(err){errors.push({at:new Date().toISOString(),message:String(err)});alert('読み込みに失敗しました')}};
function newer(a,b){let A=String(a).split('.').map(Number),B=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((A[i]||0)!==(B[i]||0))return(A[i]||0)>(B[i]||0)}return false}async function checkUpdate(showResult=false){updateState.lastCheck=new Date().toISOString();updateState.status='checking';try{let u=new URL('version.json',location.href);u.searchParams.set('_',Date.now());let r=await fetch(u,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw Error('HTTP '+r.status);let m=await r.json();updateState.remote=m;updateState.status='ok';if(newer(m.version,APP_VERSION)||m.build!==APP_BUILD){$('#updateText').textContent=`最新版 v${m.version} / ${m.build} があります`;$('#updatebar').classList.add('show')}else{if(showResult)alert(`最新版です\nv${APP_VERSION} / ${APP_BUILD}`)}}catch(err){updateState.status='failed';updateState.error=String(err);errors.push({at:new Date().toISOString(),message:'update-check: '+String(err)});if(showResult)alert('更新確認に失敗しました。通信状態を確認し、もう一度お試しください。')}}async function forceUpdate(){try{if('serviceWorker'in navigator){let regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){let ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}let u=new URL(location.href);u.searchParams.set('update',Date.now());location.replace(u.href)}catch(e){let u=new URL(location.href);u.searchParams.set('update',Date.now());location.replace(u.href)}}$('#refreshBtn').onclick=()=>checkUpdate(true);$('#applyUpdate').onclick=forceUpdate;
$('#diagBtn').onclick=()=>downloadJSON({diagnostic:true,generatedAt:new Date().toISOString(),app:{version:APP_VERSION,build:APP_BUILD,url:location.href,standalone:matchMedia('(display-mode: standalone)').matches||navigator.standalone===true},update:updateState,device:{userAgent:navigator.userAgent,language:navigator.language,online:navigator.onLine},storage:{key:KEY,horseCount:db.horses?.length||0,raceCount:db.races?.length||0,bytes:new Blob([JSON.stringify(db)]).size},errors,data:db},`dabista-diagnostic-v${APP_VERSION}.json`);checkUpdate(false);
</script></body></html>
