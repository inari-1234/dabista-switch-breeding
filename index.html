<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10261c"><title>ダビスタSwitch 牧場DB</title><style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#17221d;--muted:#66736c;--green:#174c35;--line:#dce2dd;--gold:#9a7418;--red:#9c3939}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#10261c,#1f5a40);color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:5}header h1{font-size:21px;margin:0 0 4px}.sub,.muted{font-size:12px;color:var(--muted)}header .sub{color:#d7e4dc}.wrap{max-width:760px;margin:auto;padding:12px 12px 92px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}.tab{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 2px;font-size:12px}.tab.on{background:var(--green);color:white}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.horse h2{font-size:19px;margin:0}.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;background:#e8efe9;margin:4px 3px 0 0}.gold{background:#f3ead0;color:#674b00}.red{background:#f4dddd;color:#7b2727}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#f6f7f4;border-radius:9px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat small{color:var(--muted)}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:11px;background:var(--green);color:white;padding:10px 13px;font-weight:600}.secondary{border:1px solid var(--line);background:white;border-radius:11px;padding:9px 12px}.danger{color:var(--red)}.toolbar{display:flex;gap:7px;margin-bottom:10px}.toolbar input{flex:1}.toolbar input,input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:white}.score{font-size:21px;font-weight:700;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}.fab{position:fixed;right:18px;bottom:22px;border:0;border-radius:50%;width:58px;height:58px;background:var(--green);color:white;font-size:29px;box-shadow:0 5px 18px #0004}.hidden{display:none}dialog{border:0;border-radius:17px;width:min(94vw,600px);padding:0}dialog::backdrop{background:#0007}.form{padding:17px}.form h2{margin-top:0}.form label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px}.form input,.form select,.form textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.empty{text-align:center;padding:25px;color:var(--muted)}.breaker{border-left:5px solid var(--gold)}.breaker-title{font-weight:700;font-size:15px}.mini{font-size:11px}.race-head{display:grid;grid-template-columns:1fr auto;gap:8px}.mark{font-size:20px;font-weight:700}.section-title{font-size:15px;margin:2px 0 8px}
</style></head><body><header><h1>ダビスタSwitch 牧場DB</h1><div class="sub">高SPを守りながら、バランサーを突破する個体を探す</div></header><main class="wrap"><div class="tabs"><button class="tab on" data-tab="horses">馬DB</button><button class="tab" data-tab="races">印・距離</button><button class="tab" data-tab="breed">配合</button><button class="tab" data-tab="backup">保存</button></div>
<section id="horses"><div class="toolbar"><input id="search" placeholder="馬名・父・母を検索"><button class="primary" id="photoBtn">画像</button><input id="photo" type="file" accept="image/*" multiple hidden></div><div id="horseList"></div></section>
<section id="races" class="hidden"><div class="card"><h3 class="section-title">距離・印から能力を追跡</h3><p class="muted">4番目＝高SP維持の手掛かり、5番目＝距離対応を含む総合力の手掛かりとして記録します。勝敗だけでブレイカー認定しません。</p><button class="primary" id="addRace">＋ レース記録</button></div><div id="raceCards"></div></section>
<section id="breed" class="hidden"><div class="card"><h3 class="section-title">配合検討メモ</h3><p class="muted">凱旋門ライン／後継種牡馬ライン／血統再構築ラインを分けて記録できます。ニトロ計算は次段階で追加します。</p><textarea id="breedMemo" rows="10" style="width:100%"></textarea><div class="actions"><button class="primary" id="saveMemo">保存</button></div></div></section>
<section id="backup" class="hidden"><div class="card"><h3 class="section-title">バックアップ</h3><p class="muted">馬・レース・配合メモをJSONで保存/復元できます。</p><button class="primary" id="exportBtn">書き出す</button> <button class="secondary" id="importBtn">読み込む</button><input id="importFile" type="file" accept="application/json" hidden></div></section></main><button class="fab" id="addBtn">＋</button>
<dialog id="horseDlg"><form class="form" id="horseForm"><h2>馬を登録</h2><input type="hidden" id="editId"><label>馬名</label><input id="name" required><div class="two"><div><label>性別</label><select id="sex"><option>牡</option><option>牝</option></select></div><div><label>世代・分類</label><input id="generation"></div></div><div class="two"><div><label>父</label><input id="sire"></div><div><label>母</label><input id="dam"></div></div><div class="two"><div><label>距離下限</label><input id="minD" type="number" step="100"></div><div><label>距離上限</label><input id="maxD" type="number" step="100"></div></div><div class="three"><div><label>実績</label><select id="record"><option>-</option><option>A</option><option>B</option><option>C</option></select></div><div><label>底力</label><select id="guts"><option>-</option><option>A</option><option>B</option><option>C</option></select></div><div><label>安定</label><select id="stable"><option>-</option><option>A</option><option>B</option><option>C</option></select></div></div><div class="two"><div><label>戦績</label><input id="starts"></div><div><label>主なG1</label><input id="g1"></div></div><label>評価・メモ</label><textarea id="note" rows="3"></textarea><div class="actions"><button type="button" class="secondary" onclick="horseDlg.close()">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="raceDlg"><form class="form" id="raceForm"><h2>レース記録</h2><label>馬</label><select id="raceHorse" required></select><div class="two"><div><label>レース名</label><input id="raceName" required placeholder="ジャパンC"></div><div><label>距離(m)</label><input id="raceDistance" type="number" step="100" required></div></div><div class="two"><div><label>4番目の印</label><select id="mark4"><option>◎</option><option>○</option><option>▲</option><option>△</option><option>－</option><option>不明</option></select></div><div><label>5番目の印</label><select id="mark5"><option>◎</option><option>○</option><option>▲</option><option>△</option><option>－</option><option>不明</option></select></div></div><div class="two"><div><label>着順</label><input id="finish" type="number" min="1"></div><div><label>人気</label><input id="popularity" type="number" min="1"></div></div><label>レース内容メモ</label><textarea id="raceNote" rows="3" placeholder="詰まり、展開不利、余裕勝ち等"></textarea><div class="actions"><button type="button" class="secondary" onclick="raceDlg.close()">取消</button><button class="primary">保存</button></div></form></dialog>
<script>
const KEY='dabistaFarmV1',seed={horses:[{id:'inari-shuttle',name:'イナリシャトル',sex:'牡',generation:'基準種牡馬',sire:'バゴ',dam:'イナリワルツ',minD:1000,maxD:1200,record:'A',guts:'A',stable:'C',starts:'30戦12勝',g1:'',note:'G1馬を量産した高SP基準馬。代表産駒：イナリガーデン（ジャパンC）、イナリララバイ（宝塚記念）、イナリミッキー（宝塚記念）。Nearctic 5×5、Halo 5×5。'}],races:[],memo:''};let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;db.races=db.races||[];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function horseScore(id){let rs=db.races.filter(r=>r.horseId===id&&r.distance>=2000&&r.distance<=2400),mv={'◎':5,'○':4,'▲':3,'△':2,'－':1,'不明':0};if(!rs.length)return null;let s4=rs.reduce((a,r)=>a+(mv[r.mark4]||0),0)/rs.length,s5=rs.reduce((a,r)=>a+(mv[r.mark5]||0),0)/rs.length,long=rs.filter(r=>r.distance>=2200),wins=rs.filter(r=>+r.finish===1).length;let label=s4>=4.5&&s5>=4?'ブレイカー有力':s4>=4.5&&s5>=3?'高SP・ST残存候補':s4>=4.5?'SP押し切り型':s5>=4?'ST寄り':'要データ';if(long.length&&long.every(r=>mv[r.mark4]>=4)&&long.some(r=>mv[r.mark5]>=4))label='ブレイカー有力';return{label,s4,s5,wins,n:rs.length}}
function renderHorses(){let q=$('#search').value.toLowerCase(),a=db.horses.filter(h=>[h.name,h.sire,h.dam].join(' ').toLowerCase().includes(q));$('#horseList').innerHTML=a.length?a.map(h=>{let s=horseScore(h.id);return`<article class="card horse" data-id="${h.id}"><div class="row"><div><h2>${esc(h.name)}</h2><span class="badge">${h.sex}</span><span class="badge gold">${esc(h.generation||'登録馬')}</span>${s?`<span class="badge ${s.label.includes('有力')?'gold':''}">${s.label}</span>`:''}</div><div class="score">${h.minD&&h.maxD?h.minD+'–'+h.maxD:'—'}</div></div><p class="muted">${esc(h.sire||'?')} × ${esc(h.dam||'?')}</p><div class="grid"><div class="stat"><b>${h.record||'-'}</b><small>実績</small></div><div class="stat"><b>${h.guts||'-'}</b><small>底力</small></div><div class="stat"><b>${h.stable||'-'}</b><small>安定</small></div></div>${s?`<p class="muted">2000–2400m記録 ${s.n}走｜4番目平均 ${s.s4.toFixed(1)}｜5番目平均 ${s.s5.toFixed(1)}｜勝利 ${s.wins}</p>`:''}${h.starts?`<p><b>${esc(h.starts)}</b>${h.g1?'　'+esc(h.g1):''}</p>`:''}${h.note?`<p class="muted">${esc(h.note)}</p>`:''}</article>`}).join(''):'<div class="empty">登録馬がありません</div>'}
function renderRaces(){let groups=db.horses.map(h=>({h,rs:db.races.filter(r=>r.horseId===h.id).sort((a,b)=>a.distance-b.distance)})).filter(x=>x.rs.length);$('#raceCards').innerHTML=groups.length?groups.map(({h,rs})=>{let s=horseScore(h.id);return`<div class="card ${s?.label.includes('有力')?'breaker':''}"><div class="race-head"><div><div class="breaker-title">${esc(h.name)}</div><div class="muted">${s?s.label:'判定待ち'}</div></div>${s?`<div class="score">${s.s4.toFixed(1)} / ${s.s5.toFixed(1)}</div>`:''}</div><table><tr><th>レース</th><th>距離</th><th>④</th><th>⑤</th><th>着</th><th></th></tr>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.distance}</td><td class="mark">${r.mark4}</td><td class="mark">${r.mark5}</td><td>${r.finish||'-'}</td><td><button class="secondary danger mini" data-delrace="${r.id}">削除</button></td></tr>`).join('')}</table></div>`}).join(''):'<div class="empty">まだレース記録がありません。<br>まず2000〜2400mのG1から登録してください。</div>'}
renderHorses();renderRaces();$('#search').oninput=renderHorses;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['horses','races','breed','backup'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==b.dataset.tab));$('#addBtn').style.display=b.dataset.tab==='horses'?'block':'none';if(b.dataset.tab==='races')renderRaces()});
$('#addBtn').onclick=()=>{$('#horseForm').reset();$('#editId').value='';horseDlg.showModal()};$('#horseForm').onsubmit=e=>{e.preventDefault();let id=$('#editId').value||crypto.randomUUID(),h={id,name:$('#name').value,sex:$('#sex').value,generation:$('#generation').value,sire:$('#sire').value,dam:$('#dam').value,minD:+$('#minD').value||'',maxD:+$('#maxD').value||'',record:$('#record').value,guts:$('#guts').value,stable:$('#stable').value,starts:$('#starts').value,g1:$('#g1').value,note:$('#note').value},i=db.horses.findIndex(x=>x.id===id);i>=0?db.horses[i]=h:db.horses.push(h);save();renderHorses();horseDlg.close()};$('#horseList').onclick=e=>{let c=e.target.closest('[data-id]');if(!c)return;let h=db.horses.find(x=>x.id===c.dataset.id);Object.entries({editId:h.id,name:h.name,sex:h.sex,generation:h.generation,sire:h.sire,dam:h.dam,minD:h.minD,maxD:h.maxD,record:h.record,guts:h.guts,stable:h.stable,starts:h.starts,g1:h.g1,note:h.note}).forEach(([k,v])=>$('#'+k).value=v??'');horseDlg.showModal()};
$('#addRace').onclick=()=>{$('#raceForm').reset();$('#raceHorse').innerHTML=db.horses.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');raceDlg.showModal()};$('#raceForm').onsubmit=e=>{e.preventDefault();db.races.push({id:crypto.randomUUID(),horseId:$('#raceHorse').value,name:$('#raceName').value,distance:+$('#raceDistance').value,mark4:$('#mark4').value,mark5:$('#mark5').value,finish:+$('#finish').value||'',popularity:+$('#popularity').value||'',note:$('#raceNote').value});save();renderRaces();renderHorses();raceDlg.close()};$('#raceCards').onclick=e=>{let id=e.target.dataset.delrace;if(!id)return;if(confirm('このレース記録を削除しますか？')){db.races=db.races.filter(r=>r.id!==id);save();renderRaces();renderHorses()}};
$('#breedMemo').value=db.memo||'';$('#saveMemo').onclick=()=>{db.memo=$('#breedMemo').value;save();alert('保存しました')};$('#photoBtn').onclick=()=>$('#photo').click();$('#photo').onchange=e=>alert(`${e.target.files.length}枚選択しました。画像解析は次段階で追加します。`);$('#exportBtn').onclick=()=>{let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dabista-farm-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{db=JSON.parse(await e.target.files[0].text());db.races=db.races||[];save();renderHorses();renderRaces();$('#breedMemo').value=db.memo||'';alert('復元しました')}catch{alert('読み込みに失敗しました')}};
</script></body></html>
