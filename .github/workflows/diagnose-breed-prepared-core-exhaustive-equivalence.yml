name: Diagnose exhaustive prepared-core equivalence

on:
  push:
    paths:
      - 'tests/breed-prepared-core-exhaustive-equivalence.test.js'
      - '.github/workflows/diagnose-breed-prepared-core-exhaustive-equivalence.yml'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-prepared-core-exhaustive-equivalence.test.js
      - name: Exhaustive pair equivalence
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: node tests/breed-prepared-core-exhaustive-equivalence.test.js
