name: Diagnose fourth-generation bridge vectors

on:
  push:
    paths:
      - 'tests/fourth-generation-bridge-vector-diagnostic.test.js'
      - '.github/workflows/diagnose-fourth-bridge-vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/fourth-generation-bridge-vector-diagnostic.test.js
      - name: Fourth-generation bridge-vector diagnostic
        run: node tests/fourth-generation-bridge-vector-diagnostic.test.js
