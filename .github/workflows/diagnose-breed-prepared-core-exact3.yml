name: Diagnose prepared pedigree cache exact3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-prepared-core-exact3-benchmark.test.js
      - name: Prepared pedigree cache exact3 benchmark
        run: node tests/breed-prepared-core-exact3-benchmark.test.js
