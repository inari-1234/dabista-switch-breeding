name: Validate all-sire pedigree
on:
  push:
    paths: ['.github/workflows/validate-all-sire-pedigree.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all 214 sire pedigree records
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          open('/tmp/ds96.js','w',encoding='utf-8').write(data)
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),code=fs.readFileSync('/tmp/ds96.js','utf8'),ctx={console:{log:()=>{}}};
          vm.createContext(ctx);vm.runInContext(code+'\n;globalThis.__d=new Ds96(0,0);',ctx,{timeout:15000});
          const a=ctx.__d.stallionObject;
          const bad=a.filter(x=>!x.name||!Array.isArray(x.ancestor)||x.ancestor.length!==15||String(x.omoshiro||'').length!==4||String(x.migoto||'').length!==4)
            .map(x=>({name:x.name,ancestorLength:x.ancestor?.length,omoshiro:x.omoshiro,migoto:x.migoto}));
          const pick=n=>{const x=a.find(y=>String(y.name).normalize('NFKC').trim()===n);return x&&{name:x.name,ancestor:x.ancestor,omoshiro:x.omoshiro,migoto:x.migoto,system:x.system}};
          const report={count:a.length,complete:a.length-bad.length,incomplete:bad.length,bad,samples:[pick('Galileo'),pick('Pivotal'),pick("Kitten's Joy"),pick('War Front')],passed:a.length===214&&bad.length===0};
          fs.writeFileSync('data/all-sire-pedigree-validation.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          if(!report.passed)process.exitCode=2;
          NODE
      - name: Commit report and cleanup
        if: success()
        run: |
          rm .github/workflows/validate-all-sire-pedigree.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate all sire pedigree records for sale planning"
          git push
