name: Diagnose blocked-mask end-to-end optimization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [0,1,4]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-prepared-blockmask-endtoend-benchmark.test.js
      - name: Blocked-mask end-to-end benchmark
        env:
          CASE_INDEX: ${{ matrix.case }}
        run: node tests/breed-prepared-blockmask-endtoend-benchmark.test.js
