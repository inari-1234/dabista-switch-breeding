name: Diagnose compact direct-pair index

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/sale-direct-pair-index-diagnostic.test.js
      - name: Compact direct-pair index diagnostic
        run: node tests/sale-direct-pair-index-diagnostic.test.js
