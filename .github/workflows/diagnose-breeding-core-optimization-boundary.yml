name: Diagnose breeding-core optimization boundary

on:
  push:
    paths:
      - 'tests/breeding-core-optimization-boundary-contract.test.js'
      - '.github/workflows/diagnose-breeding-core-optimization-boundary.yml'
      - 'breeding-core.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breeding-core-optimization-boundary-contract.test.js
      - name: Optimization boundary contract
        run: node tests/breeding-core-optimization-boundary-contract.test.js
