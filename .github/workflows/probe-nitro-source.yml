name: Probe nitro source
on:
  push:
    paths: ['.github/workflows/probe-nitro-source.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and inspect upstream Switch data
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for url,path in [
              ('https://ds.yublog.com/js/ds96_11.js?v26','/tmp/ds96.js'),
              ('https://ds.yublog.com/js/main.js?v26','/tmp/main.js')]:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'})
              data=urlopen(req,timeout=45).read().decode('utf-8','replace')
              open(path,'w',encoding='utf-8').write(data)
              print(url,len(data))
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('/tmp/ds96.js','utf8');
          const context={console:{log:()=>{}}};
          vm.createContext(context);
          vm.runInContext(code+'\n;globalThis.__d=new Ds96(0);',context,{timeout:15000});
          const d=context.__d;
          const props={};
          for(const k of Object.keys(d)){
            const v=d[k];
            if(Array.isArray(v)){
              props[k]={type:'array',length:v.length,firstType:typeof v[0],firstKeys:v[0]&&typeof v[0]==='object'?Object.keys(v[0]):[],sample:v.slice(0,3)};
            }else if(v&&typeof v==='object'){
              props[k]={type:'object',keys:Object.keys(v).slice(0,30)};
            }else{
              props[k]={type:typeof v,value:String(v).slice(0,200)};
            }
          }
          const needles=['nitro','nsp','nst','npw','短距離','速力','長距離','パワー','底力','cross'];
          function hits(path){
            const lines=fs.readFileSync(path,'utf8').split(/\r?\n/), out=[];
            lines.forEach((line,i)=>{const low=line.toLowerCase();if(needles.some(n=>low.includes(n.toLowerCase())))out.push({line:i+1,text:line.slice(0,1200)})});
            return out.slice(0,300);
          }
          const result={generatedAt:new Date().toISOString(),instanceProps:props,ds96Hits:hits('/tmp/ds96.js'),mainHits:hits('/tmp/main.js')};
          fs.writeFileSync('data/nitro-source-probe.json',JSON.stringify(result,null,2));
          NODE
      - name: Commit probe and cleanup
        run: |
          rm .github/workflows/probe-nitro-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nitro-source-probe.json .github/workflows/probe-nitro-source.yml
          git commit -m "Probe upstream Switch nitro source"
          git push
