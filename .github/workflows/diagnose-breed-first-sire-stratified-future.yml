name: Diagnose breed first-sire stratified future

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-first-sire-stratified-future-diagnostic.test.js
      - name: First-sire stratified future
        run: node tests/breed-first-sire-stratified-future-diagnostic.test.js
