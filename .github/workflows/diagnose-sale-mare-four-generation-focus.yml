name: Diagnose sale mare fourth generation focus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/sale-mare-four-generation-focus-diagnostic.test.js
      - name: Focused four-generation compact bridge diagnostic
        run: node tests/sale-mare-four-generation-focus-diagnostic.test.js
