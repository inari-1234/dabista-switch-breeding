name: Diagnose sale mare fourth generation focus

on:
  push:
    paths:
      - 'tests/sale-mare-four-generation-focus-diagnostic.test.js'
      - '.github/workflows/diagnose-sale-mare-four-generation-focus.yml'
      - 'sale-planner-core.js'
      - 'sale-recommendation-core.js'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/stallions.json'
      - 'data/default-broodmares.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/sale-mare-four-generation-focus-diagnostic.test.js
      - name: Focused four-generation compact bridge diagnostic
        run: node tests/sale-mare-four-generation-focus-diagnostic.test.js
