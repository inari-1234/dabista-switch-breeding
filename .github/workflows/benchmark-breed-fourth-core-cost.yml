name: Benchmark breeding portfolio cost

on:
  push:
    branches:
      - candidate/sale-mare-potential-ui
    paths:
      - '.github/workflows/benchmark-breed-fourth-core-cost.yml'
      - 'tests/breed-portfolio-cost-diagnostic.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-portfolio-cost-diagnostic.test.js
      - name: Portfolio cost
        run: node tests/breed-portfolio-cost-diagnostic.test.js
