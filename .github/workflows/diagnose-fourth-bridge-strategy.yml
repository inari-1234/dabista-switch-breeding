name: Diagnose compact fourth-generation bridge strategy

on:
  push:
    paths:
      - 'tests/fourth-generation-bridge-strategy-diagnostic.test.js'
      - '.github/workflows/diagnose-fourth-bridge-strategy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/fourth-generation-bridge-strategy-diagnostic.test.js
      - name: Compact bridge strategy diagnostic
        run: node tests/fourth-generation-bridge-strategy-diagnostic.test.js
