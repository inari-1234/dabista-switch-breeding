name: Diagnose breed chunked scan equivalence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-chunked-scan-equivalence.test.js
      - name: Chunked deep-scan equivalence
        run: node tests/breed-chunked-scan-equivalence.test.js
