name: Diagnose breed chunked scan equivalence

on:
  push:
    paths:
      - 'tests/breed-chunked-scan-equivalence.test.js'
      - '.github/workflows/diagnose-breed-chunked-scan-equivalence.yml'
      - 'sale-planner-core.js'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/stallions.json'
      - 'data/default-broodmares.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-chunked-scan-equivalence.test.js
      - name: Chunked deep-scan equivalence
        run: node tests/breed-chunked-scan-equivalence.test.js
