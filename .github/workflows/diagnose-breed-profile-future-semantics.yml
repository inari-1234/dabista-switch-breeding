name: Diagnose breed profile future semantics

on:
  push:
    paths:
      - 'tests/breed-profile-future-semantics-contract.test.js'
      - '.github/workflows/diagnose-breed-profile-future-semantics.yml'
      - 'sale-recommendation-core.js'
      - 'sale-planner-core.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-profile-future-semantics-contract.test.js
      - name: Profile-future semantic contract
        run: node tests/breed-profile-future-semantics-contract.test.js
