name: Diagnose breed integration regression scope

on:
  push:
    paths:
      - 'tests/breed-integration-regression-scope-contract.test.js'
      - '.github/workflows/diagnose-breed-integration-regression-scope.yml'
      - '.github/workflows/validate-common-engine.yml'
      - '.github/workflows/validate-sale-planner.yml'
      - 'breed-integration.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-integration-regression-scope-contract.test.js
      - name: Regression scope contract
        run: node tests/breed-integration-regression-scope-contract.test.js
