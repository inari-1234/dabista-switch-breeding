name: Validate planner inheritance
on:
  push:
    paths: ['.github/workflows/validate-planner-inheritance.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current Switch oracle
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          open('/tmp/ds96.js','w',encoding='utf-8').write(data)
          PY
      - name: Exhaustive child inheritance and elaborate analysis
        run: |
          cat > /tmp/check.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const T=JSON.parse(fs.readFileSync('data/theory-master.json','utf8'));
          const S=JSON.parse(fs.readFileSync('data/stallions.json','utf8')).stallions;
          const M=JSON.parse(fs.readFileSync('data/default-broodmares.json','utf8')).broodmares;
          const K=JSON.parse(fs.readFileSync('data/kotta-pairs.json','utf8')).pairs;
          const code=fs.readFileSync('/tmp/ds96.js','utf8'),ctx={console:{log:()=>{}}};
          vm.createContext(ctx);
          vm.runInContext(code+'\n;globalThis.__seed=new Ds96(0,0);globalThis.__pair=(si,mi)=>{const o=new Ds96(si,mi);return {a:o.child.ancestor,om:o.child.omoshiro,mg:o.child.migoto,k:o.kotta,d:o.kiken,t:o.tyokiken}}',ctx,{timeout:15000});
          const seed=ctx.__seed,canon=s=>String(s||'').normalize('NFKC').trim(),aggr=s=>canon(s).replace(/[\s・･]/g,'').toLowerCase();
          const ts=new Map(T.stallions.map(x=>[canon(x.name),x])),tm=new Map(T.broodmares.map(x=>[canon(x.name),x]));
          const si=new Map(seed.stallionObject.map((x,i)=>[canon(x.name),i])),mi=new Map(seed.broodmareObject.map((x,i)=>[canon(x.name),i]));
          function extractList(varName){
            const re=new RegExp('const\\s+'+varName+'\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*;');
            const m=code.match(re);if(!m)throw Error('missing '+varName);
            return [...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
          }
          const special=extractList('kakutei_list'),sourceElab=extractList('elaborate_list');
          const kCanon=new Set(K.map(p=>canon(p.a)+';'+canon(p.b))),kAggr=new Set(K.map(p=>aggr(p.a)+';'+aggr(p.b)));
          const srcCanon=new Set(sourceElab.map(x=>{const [a,b]=x.split(';');return canon(a)+';'+canon(b)}));
          const srcAggr=new Set(sourceElab.map(x=>{const [a,b]=x.split(';');return aggr(a)+';'+aggr(b)}));
          const spCanon=new Set(special.map(x=>{const [a,b]=x.split(';');return canon(a)+';'+canon(b)}));
          const spAggr=new Set(special.map(x=>{const [a,b]=x.split(';');return aggr(a)+';'+aggr(b)}));
          function child(st,mt){
            return [st.name,st.ancestor[0],mt.ancestor[0],st.ancestor[1],st.ancestor[2],mt.ancestor[1],mt.ancestor[2],st.ancestor[3],st.ancestor[4],st.ancestor[5],st.ancestor[6],mt.ancestor[3],mt.ancestor[4],mt.ancestor[5],mt.ancestor[6]]
          }
          function childOm(st,mt){return st.omoshiro[0]+st.omoshiro[2]+mt.omoshiro[0]+mt.omoshiro[2]}
          function childMg(st,mt){return st.omoshiro[1]+st.omoshiro[3]+mt.omoshiro[1]+mt.omoshiro[3]}
          function elab(st,mt,set,specialSet,norm){
            if(specialSet.has(norm(st.name)+';'+norm(mt.name)))return true;
            for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(set.has(norm(st.ancestor[i])+';'+norm(mt.ancestor[j])))return true;
            return false;
          }
          let total=0,ancMismatch=0,omMismatch=0,mgMismatch=0,kCanonMismatch=0,kAggrMismatch=0;const samples=[];const started=Date.now();
          for(const s of S){
            const st=ts.get(canon(s.name)),sidx=si.get(canon(s.name));if(!st||sidx==null)throw Error('missing sire '+s.name);
            for(const m of M){
              const mt=tm.get(canon(m.name)),midx=mi.get(canon(m.name));if(!mt||midx==null)throw Error('missing mare '+m.name);
              const o=ctx.__pair(sidx,midx),a=child(st,mt),om=childOm(st,mt),mg=childMg(st,mt);
              total++;
              const am=JSON.stringify(a)!==JSON.stringify(o.a),omM=om!==canon(o.om),mgM=mg!==canon(o.mg);
              if(am)ancMismatch++;if(omM)omMismatch++;if(mgM)mgMismatch++;
              const kc=(o.d||o.t)?false:elab(st,mt,kCanon,spCanon,canon);
              const ka=(o.d||o.t)?false:elab(st,mt,kAggr,spAggr,aggr);
              if(kc!==o.k)kCanonMismatch++;if(ka!==o.k)kAggrMismatch++;
              if(samples.length<20&&(am||omM||mgM||kc!==o.k||ka!==o.k))samples.push({sire:s.name,mare:m.name,oracle:{k:o.k,d:o.d,t:o.t,om:o.om,mg:o.mg},ours:{kc,ka,om,mg},am,omM,mgM});
            }
          }
          const srcMissingCanon=[...srcCanon].filter(x=>!kCanon.has(x)),kExtraCanon=[...kCanon].filter(x=>!srcCanon.has(x));
          const srcMissingAggr=[...srcAggr].filter(x=>!kAggr.has(x)),kExtraAggr=[...kAggr].filter(x=>!srcAggr.has(x));
          const domesticSpecial=special.filter(x=>{const [a,b]=x.split(';');return S.some(s=>canon(s.name)===canon(a))&&M.some(m=>canon(m.name)===canon(b))});
          const report={
            total,runtimeMs:Date.now()-started,
            child:{ancestorMismatch:ancMismatch,omoshiroMismatch:omMismatch,migotoMismatch:mgMismatch,passed:ancMismatch===0&&omMismatch===0&&mgMismatch===0},
            elaborate:{sourceListCount:sourceElab.length,webMasterCount:K.length,specialCount:special.length,domesticSpecialCount:domesticSpecial.length,kCanonMismatch,kAggrMismatch,srcMissingCanon:srcMissingCanon.slice(0,30),kExtraCanon:kExtraCanon.slice(0,30),srcMissingAggr:srcMissingAggr.slice(0,30),kExtraAggr:kExtraAggr.slice(0,30)},
            samples
          };
          fs.writeFileSync('data/planner-inheritance-validation.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          if(!report.child.passed)process.exitCode=2;
          NODE
          node /tmp/check.js
      - name: Commit report and cleanup
        if: success()
        run: |
          rm .github/workflows/validate-planner-inheritance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate planner child inheritance"
          git push
