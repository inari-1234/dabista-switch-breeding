name: Build nitro effect master
on:
  push:
    paths: ['.github/workflows/build-nitro-master.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Switch source and build factor master
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          open('/tmp/ds96.js','w',encoding='utf-8').write(data)
          lines=data.splitlines()
          open('/tmp/nitro-algo.txt','w',encoding='utf-8').write('\n'.join(f'{i+1}: {lines[i]}' for i in range(max(0,6728),min(len(lines),6810))))
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('/tmp/ds96.js','utf8'),context={console:{log:()=>{}}};
          vm.createContext(context);
          vm.runInContext(code+'\n;globalThis.__d=new Ds96(0);',context,{timeout:15000});
          const raw=context.__d.inbreedObject, effects=[];
          for(const [name,value] of Object.entries(raw)){
            const bits=String(value).split(',').map(Number);
            effects.push({
              name:String(name).normalize('NFKC'),
              short:bits[0]||0,speed:bits[1]||0,power:bits[2]||0,guts:bits[3]||0,long:bits[4]||0,
              dirt:bits[5]||0,health:bits[6]||0,early:bits[7]||0,late:bits[8]||0,steady:bits[9]||0,temper:bits[10]||0
            });
          }
          effects.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
          const out={schemaVersion:1,source:'https://ds.yublog.com/js/ds96_11.js?v26',sourceNote:'Switch版湯一路配合ツールのクロス効果祖先マスタ。ニトロ計算は重複祖先を1頭として、短距離=SP+2/ST-1、速力=SP+1、パワー=PW+1、底力=ST+1、長距離=ST+1。',count:effects.length,effects};
          fs.writeFileSync('data/nitro-effects.json',JSON.stringify(out,null,2));
          NODE
          cp /tmp/nitro-algo.txt data/nitro-algorithm-probe.txt
      - name: Commit master and cleanup
        run: |
          rm .github/workflows/build-nitro-master.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nitro-effects.json data/nitro-algorithm-probe.txt .github/workflows/build-nitro-master.yml
          git commit -m "Add Switch nitro effect master and algorithm probe"
          git push
