name: Probe child inheritance
on:
  push:
    paths: ['.github/workflows/probe-child-inheritance.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and inspect child construction
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          lines=data.splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if 'this.child' in line or 'child.' in line or 'set_child' in line or 'omoshiro' in line and 6450 <= i+1 <= 6600:
                  a=max(0,i-5); b=min(len(lines),i+12)
                  hits.append((i+1,'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b))))
          seen=set()
          for ln,block in hits:
              if ln in seen: continue
              seen.add(ln); print('--- HIT',ln,'---'); print(block)
          PY
      - name: Cleanup workflow
        run: |
          rm .github/workflows/probe-child-inheritance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove child inheritance probe workflow"
          git push
