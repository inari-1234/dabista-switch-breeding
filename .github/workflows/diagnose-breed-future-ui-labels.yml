name: Diagnose breed future UI labels

on:
  push:
    paths:
      - 'tests/breed-future-ui-labels-diagnostic.test.js'
      - '.github/workflows/diagnose-breed-future-ui-labels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-future-ui-labels-diagnostic.test.js
      - name: Future UI semantics
        run: node tests/breed-future-ui-labels-diagnostic.test.js
