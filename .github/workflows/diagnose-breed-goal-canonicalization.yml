name: Diagnose breed goal canonicalization

on:
  push:
    paths:
      - 'tests/breed-goal-canonicalization-contract.test.js'
      - '.github/workflows/diagnose-breed-goal-canonicalization.yml'
      - 'index.html'
      - 'v26.js'
      - 'breed-helper.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-goal-canonicalization-contract.test.js
      - name: Goal canonicalization contract
        run: node tests/breed-goal-canonicalization-contract.test.js
