name: Diagnose facts-only terminal optimization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-facts-only-terminal-diagnostic.test.js
      - name: Facts-only terminal optimization
        run: node tests/breed-facts-only-terminal-diagnostic.test.js
