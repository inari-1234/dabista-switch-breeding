name: Diagnose optimized fixed-first representative matrix

on:
  push:
    paths:
      - 'tests/breed-fixed-first-optimized-matrix.test.js'
      - 'tests/aggregate-breed-fixed-first-optimized-matrix.test.js'
      - '.github/workflows/diagnose-breed-fixed-first-optimized-matrix.yml'
      - 'sale-planner-core.js'
      - 'sale-recommendation-core.js'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/stallions.json'
      - 'data/default-broodmares.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: |
          node --check tests/breed-fixed-first-optimized-matrix.test.js
          node --check tests/aggregate-breed-fixed-first-optimized-matrix.test.js
      - name: Optimized fixed-first representative
        env:
          CASE_INDEX: ${{ matrix.case }}
          OUTPUT_FILE: fixed-opt-${{ matrix.case }}.json
        run: node tests/breed-fixed-first-optimized-matrix.test.js
      - name: Upload optimized representative
        uses: actions/upload-artifact@v4
        with:
          name: fixed-opt-${{ matrix.case }}
          path: fixed-opt-${{ matrix.case }}.json
          if-no-files-found: error

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized results
        uses: actions/download-artifact@v4
        with:
          pattern: fixed-opt-*
          path: fixed-opt
          merge-multiple: true
      - name: Aggregate optimized matrix
        run: node tests/aggregate-breed-fixed-first-optimized-matrix.test.js fixed-opt
