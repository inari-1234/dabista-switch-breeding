name: Probe dangerous cross logic
on:
  push:
    paths: ['.github/workflows/probe-danger-logic.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream and extract exact danger logic
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          lines=data.splitlines()
          ranges=[(6798,7095),(6490,6535),(6600,6675)]
          out=[]
          for a,b in ranges:
              out.append(f'### L{a}-L{b}')
              out.extend(f'{i+1}: {lines[i]}' for i in range(a-1,min(len(lines),b)))
          open('data/danger-logic-probe.txt','w',encoding='utf-8').write('\n'.join(out))
          PY
      - name: Commit probe and cleanup
        run: |
          rm .github/workflows/probe-danger-logic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/danger-logic-probe.txt .github/workflows/probe-danger-logic.yml
          git commit -m "Probe exact dangerous cross logic"
          git push
