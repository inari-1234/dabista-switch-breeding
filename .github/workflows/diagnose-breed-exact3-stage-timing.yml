name: Diagnose exact3 stage timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-exact3-stage-timing-diagnostic.test.js
      - name: Exact3 stage timing
        run: node tests/breed-exact3-stage-timing-diagnostic.test.js
