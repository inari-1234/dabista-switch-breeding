name: Diagnose breed fixed first-sire future

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-fixed-first-sire-future-diagnostic.test.js
      - name: Fixed first-sire future
        run: node tests/breed-fixed-first-sire-future-diagnostic.test.js
