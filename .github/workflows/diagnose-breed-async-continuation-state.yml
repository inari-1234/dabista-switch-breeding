name: Diagnose async breed continuation state

on:
  push:
    paths:
      - 'tests/breed-async-continuation-state-contract.test.js'
      - '.github/workflows/diagnose-breed-async-continuation-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-async-continuation-state-contract.test.js
      - name: Async continuation state
        run: node tests/breed-async-continuation-state-contract.test.js
