name: Diagnose breed fixed-sire category future status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-fixed-sire-category-future-status.test.js
      - name: Fixed-sire meaningful category future
        run: node tests/breed-fixed-sire-category-future-status.test.js
