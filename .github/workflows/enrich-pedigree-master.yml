name: Enrich pedigree master

on:
  push:
    paths:
      - '.github/workflows/enrich-pedigree-master.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified parentage master
        run: |
          python - <<'PY'
          import json, re, time
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from datetime import datetime, timezone

          UA='Mozilla/5.0 (compatible; DabistaFarmDB/1.0; pedigree catalog)'
          def fetch(url):
              req=Request(url,headers={'User-Agent':UA})
              with urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')

          class LinkParser(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      h=dict(attrs).get('href')
                      if h:self.links.append(h)
          class TextParser(HTMLParser):
              def __init__(self):super().__init__();self.text=[];self.heading=[];self._head=False
              def handle_starttag(self,tag,attrs):
                  if tag in ('h4','h5','h3'):self._head=True
              def handle_endtag(self,tag):
                  if tag in ('h4','h5','h3'):self._head=False
              def handle_data(self,data):
                  s=' '.join(data.split())
                  if s:
                      self.text.append(s)
                      if self._head:self.heading.append(s)

          def detail_links(index_url,needle):
              p=LinkParser();p.feed(fetch(index_url))
              return sorted(set(urljoin(index_url,h) for h in p.links if needle in h))
          def val_after(tokens,label,start=0,stop=None):
              end=len(tokens) if stop is None else stop
              for i in range(start,end-1):
                  if tokens[i]==label:return tokens[i+1]
              return ''
          def parse_detail(url,kind):
              try:
                  p=TextParser();p.feed(fetch(url));t=p.text
                  name=''.join(p.heading[:1]).strip()
                  if not name:return None
                  try:start=t.index(name)
                  except:start=0
                  stops=[i for i,x in enumerate(t) if i>start and x in ('スピード','距離')]
                  stop=min(stops) if stops else min(len(t),start+40)
                  sire=val_after(t,'父',start,stop);dam=val_after(t,'母',start,stop);ds=val_after(t,'母父',start,stop)
                  if not (sire or dam or ds):return None
                  return {'name':name,'sire':sire,'dam':dam,'damSire':ds,'kind':kind,'source':'bonyou.info'}
              except Exception as e:
                  print('skip',url,type(e).__name__,e);return None

          targets=[]
          for base,needle,kind in [
              ('https://bonyou.info/derby-stallion-switch/stallion/','/stallion/detail/?id=','default-stallion'),
              ('https://bonyou.info/derby-stallion-switch/broodmare/','/broodmare/detail/?id=','default-broodmare')]:
              ls=detail_links(base,needle);print(kind,'links',len(ls));targets += [(u,kind) for u in ls]
          if len(targets)<300: raise RuntimeError(f'detail links unexpectedly short: {len(targets)}')

          found=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs=[ex.submit(parse_detail,u,k) for u,k in targets]
              for i,f in enumerate(as_completed(futs),1):
                  r=f.result()
                  if r:found.append(r)
                  if i%50==0:print('processed',i,'found',len(found))
          if len(found)<250: raise RuntimeError(f'parentage unexpectedly short: {len(found)}')

          path=Path('data/pedigree-master.json')
          old=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'horses':[]}
          by={x['name']:{**x} for x in old.get('horses',[]) if x.get('name')}
          for x in found:
              cur=by.get(x['name'],{'name':x['name']})
              for k in ('sire','dam','damSire','kind','source'):
                  if x.get(k) and not cur.get(k):cur[k]=x[k]
              by[x['name']]=cur
          horses=sorted(by.values(),key=lambda x:x['name'])
          stamp=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out={'schemaVersion':2,'updatedAt':stamp,'note':'ゲーム内デフォルト馬の入力補完用。bonyou.infoの個別ページから父・母・母父を取得し、既存の手入力値を優先して統合。','count':len(horses),'horses':horses}
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('pedigree master',len(horses),'newly fetched',len(found))
          PY
      - name: Commit enriched pedigree
        run: |
          if git diff --quiet -- data/pedigree-master.json; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pedigree-master.json
          git commit -m 'Enrich default horse pedigree master'
          git push
