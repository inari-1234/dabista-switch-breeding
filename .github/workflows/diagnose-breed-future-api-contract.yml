name: Diagnose breed future API contract

on:
  push:
    paths:
      - 'tests/breed-future-api-contract.test.js'
      - '.github/workflows/diagnose-breed-future-api-contract.yml'
      - 'sale-planner-core.js'
      - 'sale-recommendation-core.js'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/stallions.json'
      - 'data/default-broodmares.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-future-api-contract.test.js
      - name: Future API contract
        run: node tests/breed-future-api-contract.test.js
