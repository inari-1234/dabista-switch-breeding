name: Diagnose breed future API contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-future-api-contract.test.js
      - name: Future API contract
        run: node tests/breed-future-api-contract.test.js
