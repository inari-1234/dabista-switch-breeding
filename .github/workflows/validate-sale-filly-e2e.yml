name: Validate sale filly end to end
on:
  push:
    paths: ['.github/workflows/validate-sale-filly-e2e.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current Switch oracle
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          url='https://ds.yublog.com/js/ds96_11.js?v26'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DabistaFarmDB/1.0)'}),timeout=45).read().decode('utf-8','replace')
          open('/tmp/ds96.js','w',encoding='utf-8').write(data)
          PY
      - name: Validate foreign-sired sale fillies then domestic mating
        run: |
          cat > /tmp/e2e.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const T=JSON.parse(fs.readFileSync('data/theory-master.json','utf8'));
          const S=JSON.parse(fs.readFileSync('data/stallions.json','utf8')).stallions;
          const E=JSON.parse(fs.readFileSync('data/nitro-effects.json','utf8')).effects;
          const K=JSON.parse(fs.readFileSync('data/kotta-pairs.json','utf8')).pairs;
          const code=fs.readFileSync('/tmp/ds96.js','utf8'),ctx={console:{log:()=>{}}};
          vm.createContext(ctx);
          vm.runInContext(code+'\n;globalThis.__seed=new Ds96(0,0);',ctx,{timeout:15000});
          const seed=ctx.__seed;
          const canon=s=>String(s||'').normalize('NFKC').trim();
          const norm=s=>canon(s).replace(/[\s・･]/g,'').toLowerCase();
          const tS=new Map(T.stallions.map(x=>[norm(x.name),x])),tM=new Map(T.broodmares.map(x=>[norm(x.name),x]));
          const si=new Map(seed.stallionObject.map((x,i)=>[norm(x.name),i])),mi=new Map(seed.broodmareObject.map((x,i)=>[norm(x.name),i]));
          const rawS=new Map(seed.stallionObject.map(x=>[norm(x.name),x])),rawM=new Map(seed.broodmareObject.map(x=>[norm(x.name),x]));
          const em=new Map(E.map(x=>[norm(x.name),x]));
          const pairs=new Set(K.map(p=>norm(p.a)+'|'+norm(p.b)));
          const specialRaw=(()=>{
            const m=code.match(/const\s+kakutei_list\s*=\s*\[([\s\S]*?)\]\s*;/);
            return new Set([...(m?.[1]||'').matchAll(/"([^"]+)"/g)].map(x=>{const [a,b]=x[1].split(';');return norm(a)+'|'+norm(b)}));
          })();
          const sourceElab=(()=>{
            const m=code.match(/const\s+elaborate_list\s*=\s*\[([\s\S]*?)\]\s*;/);
            return new Set([...(m?.[1]||'').matchAll(/"([^"]+)"/g)].map(x=>{const [a,b]=x[1].split(';');return canon(a)+'|'+canon(b)}));
          })();
          function child(s,m){
            return {
              name:s.name+'×'+m.name,
              system:s.system,
              ancestor:[s.name,s.ancestor[0],m.ancestor[0],s.ancestor[1],s.ancestor[2],m.ancestor[1],m.ancestor[2],s.ancestor[3],s.ancestor[4],s.ancestor[5],s.ancestor[6],m.ancestor[3],m.ancestor[4],m.ancestor[5],m.ancestor[6]],
              omoshiro:s.omoshiro[0]+s.omoshiro[2]+m.omoshiro[0]+m.omoshiro[2],
              migoto:s.omoshiro[1]+s.omoshiro[3]+m.omoshiro[1]+m.omoshiro[3],
              dirt:0,konjo:0,price:0,speed:0,stamina:0,power:0
            }
          }
          function uniq(s){let out='';for(const ch of String(s||''))if(!out.includes(ch))out+=ch;return out}
          function theory(s,m){
            const interesting=uniq(s.omoshiro+m.omoshiro).length>=7;
            const magnificent=[...uniq(s.migoto)].sort().join('')===[...uniq(m.omoshiro)].sort().join('');
            return{interesting,magnificent,perfect:interesting&&magnificent}
          }
          function nitro(s,m){
            const seen=new Set();let sp=0,st=0,pw=0;
            for(const name of [...m.ancestor,...s.ancestor]){
              const k=norm(name);if(!k||seen.has(k))continue;seen.add(k);const e=em.get(k);if(!e)continue;
              sp+=(e.short||0)*2+(e.speed||0);st+=(e.guts||0)+(e.long||0)-(e.short||0);pw+=(e.power||0)
            }
            return{sp,st,pw}
          }
          function locks(mother,father){
            const out=[],add=(...a)=>out.push(...a);
            if(father===0){if(mother===0)add('1,1','3,3','4,4','7,7','8,8','9,9','10,10');else if(mother===1)add('1,3','3,7','4,8');else if(mother===2)add('1,5','3,11','4,12');else if(mother<=6)add('1,'+(mother*2+1))}
            else if(father===1){if(mother===0)add('3,1','7,3','8,4');else if(mother===1)add('3,3','7,7','8,8');else if(mother===2)add('3,5','7,11','8,12');else if(mother<=6)add('3,'+(mother*2+1))}
            else if(father===2){if(mother===0)add('5,1','11,3','12,4');else if(mother===1)add('5,3','11,7','12,8');else if(mother===2)add('5,5','11,11','12,12');else if(mother<=6)add('5,'+(mother*2+1))}
            else if(father===3&&mother<=6)add('7,'+(mother*2+1));else if(father===4&&mother<=6)add('9,'+(mother*2+1));else if(father===5&&mother<=6)add('11,'+(mother*2+1));else if(father===6&&mother<=6)add('13,'+(mother*2+1));
            return out
          }
          function danger(s,m){
            const blocked=new Set();let cnt=0,t=false,stop2=false;
            for(let i=0;i<m.ancestor.length;i++){
              if(canon(s.name)===canon(m.ancestor[i])){t=true;stop2=true}
              if(stop2)continue;
              for(let j=0;j<s.ancestor.length;j++){
                if(blocked.has(j+','+i))continue;
                if(canon(s.ancestor[j])===canon(m.ancestor[i])){
                  cnt++;if(i===0&&j===0)t=true;for(const x of locks(i,j))blocked.add(x)
                }
              }
            }
            return{cnt,k:cnt>6,t}
          }
          function elaboratePublic(s,m,d){
            if(d.k||d.t)return false;
            if(specialRaw.has(norm(s.name)+'|'+norm(m.name)))return true;
            for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(pairs.has(norm(s.ancestor[i])+'|'+norm(m.ancestor[j])))return true;
            return false
          }
          function elaborateOracleSemantics(s,m,d){
            if(d.k||d.t)return false;
            if(specialRaw.has(norm(s.name)+'|'+norm(m.name)))return true;
            for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(sourceElab.has(canon(s.ancestor[i])+'|'+canon(m.ancestor[j])))return true;
            return false
          }
          const cases=[['Pivotal','シェイクロマン'],['Galileo','トリトンプリンセス']];
          const report={oracleHasSetBroodmare:typeof seed.set_broodmare==='function',cases:[],totals:{futurePairs:0,metricMismatch:0,publicElaborateVsOracleMismatch:0}};
          for(const [sn,mn] of cases){
            const sidx=si.get(norm(sn)),midx=mi.get(norm(mn)),saleSire=rawS.get(norm(sn)),saleDam=rawM.get(norm(mn));
            if(sidx==null||midx==null||!saleSire||!saleDam)throw Error('sale pair missing '+sn+' / '+mn);
            ctx.__si=sidx;ctx.__mi=midx;
            const base=vm.runInContext('new Ds96(globalThis.__si,globalThis.__mi)',ctx,{timeout:15000});
            const oursChild=child(saleSire,saleDam),oracleChild=JSON.parse(JSON.stringify(base.child));
            const childCheck={
              ancestor:oursChild.ancestor.every((x,i)=>canon(x)===canon(oracleChild.ancestor[i])),
              omoshiro:oursChild.omoshiro===oracleChild.omoshiro,
              migoto:oursChild.migoto===oracleChild.migoto
            };
            const cr={salePair:[sn,mn],childCheck,child:{ancestor:oursChild.ancestor,omoshiro:oursChild.omoshiro,migoto:oursChild.migoto},future:{checked:0,metricMismatch:0,publicElaborateVsOracleMismatch:0,samples:[]},paretoCandidates:[]};
            const candidates=[];
            for(const ds of S){
              const st=tS.get(norm(ds.name)),dsi=si.get(norm(ds.name));if(!st||dsi==null)continue;
              const d=danger(st,oursChild),n=nitro(st,oursChild),th=theory(st,oursChild),elPub=elaboratePublic(st,oursChild,d),elOracleSem=elaborateOracleSemantics(st,oursChild,d);
              ctx.__dsi=dsi;ctx.__child=oracleChild;
              const o=vm.runInContext('(()=>{const x=new Ds96(globalThis.__dsi,0);x.set_broodmare(globalThis.__child);return {cnt:x.inbreedcnt,k:x.kiken,t:x.tyokiken,sp:x.nitro_speed,st:x.nitro_stamina,pw:x.nitro_power,om:x.omoshiro,mg:x.migoto,pk:x.kanpeki,el:x.kotta}})()',ctx,{timeout:15000});
              const mismatch=d.cnt!==o.cnt||d.k!==o.k||d.t!==o.t||n.sp!==o.sp||n.st!==o.st||n.pw!==o.pw||th.interesting!==o.om||th.magnificent!==o.mg||th.perfect!==o.pk||elOracleSem!==o.el;
              cr.future.checked++;report.totals.futurePairs++;
              if(mismatch){cr.future.metricMismatch++;report.totals.metricMismatch++;if(cr.future.samples.length<8)cr.future.samples.push({sire:ds.name,ours:{d,n,th,elOracleSem},oracle:o})}
              if(elPub!==o.el){cr.future.publicElaborateVsOracleMismatch++;report.totals.publicElaborateVsOracleMismatch++}
              if(!d.k&&!d.t)candidates.push({name:ds.name,n,theory:th,elaborate:elPub,record:ds.record,guts:ds.guts,stable:ds.stable,minD:ds.minD,maxD:ds.maxD})
            }
            const g=v=>v==='A'?3:v==='B'?2:v==='C'?1:0;
            const vec=x=>[x.n.sp,x.n.st,x.n.pw,g(x.record),g(x.guts),x.elaborate?1:0,x.theory.interesting?1:0,x.theory.magnificent?1:0,(x.minD<=2400&&x.maxD>=2400)?1:0];
            const dom=(a,b)=>{const A=vec(a),B=vec(b);return A.every((v,i)=>v>=B[i])&&A.some((v,i)=>v>B[i])};
            cr.paretoCandidates=candidates.filter(x=>!candidates.some(y=>y!==x&&dom(y,x))).map(x=>({name:x.name,n:x.n,theory:x.theory,elaborate:x.elaborate,record:x.record,guts:x.guts,stable:x.stable,range:[x.minD,x.maxD]}));
            report.cases.push(cr)
          }
          report.passed=report.oracleHasSetBroodmare&&report.cases.every(x=>Object.values(x.childCheck).every(Boolean)&&x.future.metricMismatch===0);
          fs.writeFileSync('data/sale-filly-e2e-validation.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          if(!report.passed)process.exitCode=2;
          NODE
          node /tmp/e2e.js
      - name: Commit report and cleanup
        if: success()
        run: |
          rm .github/workflows/validate-sale-filly-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate foreign-sired sale filly planning end to end"
          git push
