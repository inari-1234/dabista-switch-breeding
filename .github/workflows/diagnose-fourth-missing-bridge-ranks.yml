name: Diagnose missing fourth-generation bridge ranks

on:
  push:
    paths:
      - 'tests/fourth-generation-missing-bridge-ranks.test.js'
      - '.github/workflows/diagnose-fourth-missing-bridge-ranks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/fourth-generation-missing-bridge-ranks.test.js
      - name: Missing bridge rank diagnostic
        run: node tests/fourth-generation-missing-bridge-ranks.test.js
