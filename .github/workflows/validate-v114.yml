name: Validate v1.14
on:
  push:
    paths: ['.github/workflows/validate-v114.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static validation
        run: |
          node --check v24.js
          python -m json.tool data/rebuild-research.json >/dev/null
          python -m json.tool version.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          idx=Path('index.html').read_text()
          assert 'v24.js?v=1.14.0' in idx
          assert 'v23.js' not in idx
          assert '1.13.0' not in idx
          assert idx.count('<section') == idx.count('</section>')
          assert idx.count('<dialog') == idx.count('</dialog>')
          research=json.load(open('data/rebuild-research.json'))
          mares={x['name']:x for x in json.load(open('data/default-broodmares.json'))['broodmares']}
          stallions={x['name']:x for x in json.load(open('data/stallions.json'))['stallions']}
          expected={
            'エイスト':(60,76,62,6,7,1),
            'ミゼラブルウェイ':(64,58,58,9,2,0),
            'ミニミニデート':(62,46,53,10,5,0),
            'ラブアタック':(60,42,51,11,0,1),
          }
          for n,v in expected.items():
            m=mares[n]
            assert (m['sp'],m['st'],m['pw'],m['nsp'],m['nst'],m['npw'])==v,(n,m)
          exp_s={
            'ステイゴールド':(1800,2600,'A','A','C'),
            'ダイワメジャー':(1400,1800,'A','B','A'),
            'ワイルドラッシュ':(1400,1800,'B','B','A'),
          }
          for n,v in exp_s.items():
            s=stallions[n]
            assert (s['minD'],s['maxD'],s['record'],s['guts'],s['stable'])==v,(n,s)
          ids={r['id'] for r in research['routes']}
          assert ids=={'arc-a','rebuild-b','bc-c1','bc-c2'}
          assert research['constraints']['platform']=='Nintendo Switch版'
          assert research['constraints']['foreignStallionsAvailable'] is False
          assert research['constraints']['springSweetsRequired'] is False
          pairs={r['id']:(r['firstPairNitro']['sp'],r['firstPairNitro']['st']) for r in research['routes']}
          assert pairs['arc-a']==(14,8)
          assert pairs['rebuild-b']==(16,3)
          assert pairs['bc-c1']==(20,5)
          assert pairs['bc-c2']==(16,6)
          ver=json.load(open('version.json'))
          assert ver['version']=='1.14.0' and ver['build']=='2026.09.18-31'
          print('PASS: v1.14 static/master regression checks')
          PY
      - name: Cleanup validation workflow
        run: |
          rm .github/workflows/validate-v114.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate v1.14 rebuild research and remove one-time workflow"
          git push
