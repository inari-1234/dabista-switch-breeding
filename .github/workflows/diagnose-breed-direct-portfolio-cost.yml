name: Diagnose breed direct portfolio cost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-direct-portfolio-cost-diagnostic.test.js
      - name: Direct portfolio cost
        env:
          CASE_INDEX: ${{ matrix.case }}
          OUTPUT_FILE: direct-portfolio-${{ matrix.case }}.json
        run: node tests/breed-direct-portfolio-cost-diagnostic.test.js
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: direct-portfolio-${{ matrix.case }}
          path: direct-portfolio-${{ matrix.case }}.json
          if-no-files-found: error
