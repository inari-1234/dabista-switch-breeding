name: Precheck v1.15 final
on:
  push:
    paths: ['.github/workflows/precheck-v115b.yml']
permissions:
  contents: write
jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          node --check v25.js
          python -m json.tool data/nitro-effects.json >/dev/null
          python -m json.tool data/rebuild-research.json >/dev/null
      - run: |
          rm .github/workflows/precheck-v115b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Precheck final v1.15 nitro engine"
          git push
