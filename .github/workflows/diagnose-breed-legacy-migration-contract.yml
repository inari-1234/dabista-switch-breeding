name: Diagnose breed legacy migration contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-legacy-migration-contract.test.js
      - name: Legacy migration contract
        run: node tests/breed-legacy-migration-contract.test.js
