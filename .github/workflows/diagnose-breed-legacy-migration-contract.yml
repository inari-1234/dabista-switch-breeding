name: Diagnose breed legacy migration contract

on:
  push:
    paths:
      - 'tests/breed-legacy-migration-contract.test.js'
      - '.github/workflows/diagnose-breed-legacy-migration-contract.yml'
      - 'v18.js'
      - 'v19.js'
      - 'v20.js'
      - 'v21.js'
      - 'v25.js'
      - 'breed-helper.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-legacy-migration-contract.test.js
      - name: Legacy migration contract
        run: node tests/breed-legacy-migration-contract.test.js
