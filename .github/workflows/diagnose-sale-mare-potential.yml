name: Diagnose sale mare potential matrix

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/sale-mare-potential-ui
    paths:
      - '.github/workflows/diagnose-sale-mare-potential.yml'
      - 'tests/sale-mare-potential-matrix-diagnostic.test.js'
      - 'tests/aggregate-sale-mare-potential-shards.test.js'
      - 'sale-planner-core.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: |
          node --check tests/sale-mare-potential-matrix-diagnostic.test.js
          node --check tests/aggregate-sale-mare-potential-shards.test.js
      - name: Exhaustive mare potential shard
        env:
          SHARD_COUNT: 8
          SHARD_INDEX: ${{ matrix.shard }}
          OUTPUT_FILE: potential-shard-${{ matrix.shard }}.json
        run: node tests/sale-mare-potential-matrix-diagnostic.test.js
      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: potential-${{ matrix.shard }}
          path: potential-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: potential-*
          path: potential
          merge-multiple: true
      - name: Aggregate 331 mare matrix
        run: node tests/aggregate-sale-mare-potential-shards.test.js potential
