name: Benchmark breed stage timing

on:
  push:
    branches:
      - candidate/sale-mare-potential-ui
    paths:
      - '.github/workflows/benchmark-breed-stage-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-exact3-stage-timing-diagnostic.test.js
      - name: Exact3 and compact4 stage timing
        run: node tests/breed-exact3-stage-timing-diagnostic.test.js
