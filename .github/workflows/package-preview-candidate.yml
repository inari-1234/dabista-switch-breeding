name: Package preview candidate

on:
  push:
    branches:
      - candidate/growth-tracking
    paths:
      - '.github/workflows/package-preview-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package candidate working tree
        run: |
          rm -rf preview-package
          mkdir preview-package
          rsync -a --exclude '.git' --exclude 'preview-package' ./ preview-package/
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-preview-package
          path: preview-package
          retention-days: 1
