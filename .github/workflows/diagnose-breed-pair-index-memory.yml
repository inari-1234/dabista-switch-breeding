name: Diagnose breed pair-index memory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-pair-index-memory-diagnostic.test.js
      - name: Pair-index memory diagnostic
        run: node tests/breed-pair-index-memory-diagnostic.test.js
