name: Diagnose breed pair nitro unification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-pair-nitro-unification-diagnostic.test.js
      - name: Pair nitro unification
        run: node tests/breed-pair-nitro-unification-diagnostic.test.js
