name: Diagnose breed pair-cache filter equivalence

on:
  push:
    paths:
      - 'tests/breed-pair-cache-filter-equivalence.test.js'
      - '.github/workflows/diagnose-breed-pair-cache-filter-equivalence.yml'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-pair-cache-filter-equivalence.test.js
      - name: Pair-cache filter equivalence
        run: node tests/breed-pair-cache-filter-equivalence.test.js
