name: Diagnose optimized fixed-first future

on:
  push:
    paths:
      - 'tests/breed-fixed-first-sire-optimized-diagnostic.test.js'
      - '.github/workflows/diagnose-breed-fixed-first-optimized.yml'
      - 'sale-planner-core.js'
      - 'sale-recommendation-core.js'
      - 'breeding-core.js'
      - 'data/theory-master.json'
      - 'data/stallions.json'
      - 'data/default-broodmares.json'
      - 'data/nitro-effects.json'
      - 'data/kotta-pairs.json'
      - 'data/elaborate-direct-exceptions.json'
      - 'data/planner-inheritance-validation.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-fixed-first-sire-optimized-diagnostic.test.js
      - name: Optimized fixed-first continuation
        run: node tests/breed-fixed-first-sire-optimized-diagnostic.test.js
