name: Probe system pages

on:
  push:
    paths:
      - '.github/workflows/probe-system-pages.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source pages
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin
          import re
          UA={'User-Agent':'Mozilla/5.0'}
          def get(url):
              return urlopen(Request(url,headers=UA),timeout=30).read().decode('utf-8','replace')
          for url in ['https://ds.yublog.com/system_search.html','https://ds.yublog.com/system_search2.html']:
              print('\nURL',url)
              html=get(url)
              print('len',len(html))
              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
              print('SCRIPT SRCS',srcs)
              for src in srcs:
                  if 'google' in src or 'googletag' in src: continue
                  full=urljoin(url,src)
                  try:
                      js=get(full)
                      print('\nSCRIPT',full,'LEN',len(js),'Ds96',('Ds96' in js),'broodmareObject',('broodmareObject' in js),'stallionObject',('stallionObject' in js))
                      if 'Ds96' in js or 'broodmareObject' in js or 'stallionObject' in js:
                          print(js[:3000])
                  except Exception as e: print('ERR',full,e)
          PY