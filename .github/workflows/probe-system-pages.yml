name: Probe system pages

on:
  push:
    paths:
      - '.github/workflows/probe-system-pages.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source pages
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import re
          for url in ['https://ds.yublog.com/system_search.html','https://ds.yublog.com/system_search2.html']:
              print('\nURL',url)
              req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
              html=urlopen(req,timeout=30).read().decode('utf-8','replace')
              print('len',len(html))
              for pat in [r'<script[^>]+src=["\']([^"\']+)',r'\.js[^"\']*',r'<tbody[\s\S]{0,500}',r'ディープインパクト.{0,500}',r'アイオーティー.{0,500}']:
                  m=re.search(pat,html,re.I)
                  print('PAT',pat,'=>',m.group(0)[:1200] if m else 'NONE')
              print('SYSTEM TOKENS',sorted(set(re.findall(r'\b(?:Ec|Ph|Ns|Ro|Ne|Na|Fa|To|Te|Sw|Ha|Hi|St|Ma|He)\b',html)))[:20])
          PY