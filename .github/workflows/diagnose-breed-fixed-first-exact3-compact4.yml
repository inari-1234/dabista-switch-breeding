name: Diagnose fixed-first exact3 compact4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: node --check tests/breed-fixed-first-exact3-compact4-diagnostic.test.js
      - name: Exact3 compact4
        env:
          CASE_INDEX: ${{ matrix.case }}
          OUTPUT_FILE: exact3-compact4-${{ matrix.case }}.json
        run: node tests/breed-fixed-first-exact3-compact4-diagnostic.test.js
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: exact3-compact4-${{ matrix.case }}
          path: exact3-compact4-${{ matrix.case }}.json
          if-no-files-found: error
