name: Align v16 version
on:
  push:
    paths:
      - '.github/workflows/fix-v16-version.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v16.js')
          s=p.read_text(encoding='utf-8')
          old="const V='1.7.0',BUILD='2026.09.15-23';"
          new="const V='1.8.0',BUILD='2026.09.15-24';"
          if old not in s: raise SystemExit('expected version marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v16.js
          git commit -m 'Align v16 compatibility layer with v1.8' || exit 0
          git push