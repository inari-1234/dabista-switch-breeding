name: Generate multigeneration mare purpose ranking

on:
  push:
    branches:
      - candidate/growth-tracking
    paths:
      - 'scripts/generate-mare-purpose-multigen-ranking.js'
      - '.github/workflows/generate-multigen-ranking.yml'
      - 'sale-recommendation-core.js'
      - 'sale-planner-core.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: |
          node --check scripts/generate-mare-purpose-multigen-ranking.js
          node --check sale-recommendation-core.js
      - name: Reference three-mares smoke
        run: |
          node scripts/generate-mare-purpose-multigen-ranking.js --names=エイスト,スプリングスイーツ,クイーンズスミレ --output=/tmp/multigen-sample.json
          node - <<'NODE'
          const x=require('/tmp/multigen-sample.json');
          if(x.analyzedCount!==3)throw Error('sample count '+x.analyzedCount);
          for(const n of ['エイスト','スプリングスイーツ','クイーンズスミレ']){
            const r=x.mares[n]; if(!r)throw Error('missing '+n);
            for(const g of ['arc','bc','rebuild','stallion']){
              if(!r.goals[g]?.generation)throw Error(n+' '+g+' generation missing');
              if(!r.goals[g]?.grade?.key)throw Error(n+' '+g+' grade missing');
              if(!r.goals[g]?.sires?.length)throw Error(n+' '+g+' sires missing');
            }
          }
          console.log(JSON.stringify({passed:true,references:Object.fromEntries(Object.entries(x.mares).map(([n,r])=>[n,Object.fromEntries(Object.entries(r.goals).map(([g,v])=>[g,{generation:v.generation,grade:v.grade.key,sires:v.sires}]))]))},null,2));
          NODE
      - name: Generate all known mares
        run: |
          node scripts/generate-mare-purpose-multigen-ranking.js --output=mare-purpose-multigen-ranking.json
      - name: Validate generated ranking
        run: |
          node - <<'NODE'
          const x=require('./mare-purpose-multigen-ranking.json');
          if(x.analyzedCount!==298)throw Error('expected 298, got '+x.analyzedCount);
          for(const [name,row] of Object.entries(x.mares)){
            for(const g of ['arc','bc','rebuild','stallion']){
              const v=row.goals[g];
              if(!v?.rank||v.total!==298)throw Error(name+' '+g+' rank '+JSON.stringify(v));
              if(![1,2,3,4].includes(v.generation))throw Error(name+' '+g+' generation');
              if(!['recommend','candidate','conditional','insufficient'].includes(v.grade?.key))throw Error(name+' '+g+' grade');
              if(v.sires.length!==v.generation)throw Error(name+' '+g+' route length');
            }
          }
          const arc=Object.entries(x.mares).sort((a,b)=>a[1].goals.arc.rank-b[1].goals.arc.rank).slice(0,10).map(([n,r])=>({name:n,rank:r.goals.arc.rank,generation:r.goals.arc.generation,grade:r.goals.arc.grade.key}));
          console.log(JSON.stringify({passed:true,elapsedSeconds:x.elapsedSeconds,arcTop10:arc,eist:x.mares['エイスト']?.goals.arc,spring:x.mares['スプリングスイーツ']?.goals.arc,queens:x.mares['クイーンズスミレ']?.goals},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mare-purpose-multigen-ranking
          path: mare-purpose-multigen-ranking.json
          retention-days: 7
