name: Build elaborate breeding pair master
on:
  push:
    paths:
      - '.github/workflows/scrape-kotta.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape confirmed elaborate pairs
        run: |
          python - <<'PY'
          import json, unicodedata
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from datetime import datetime,timezone
          from pathlib import Path
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.row=None; self.cell=None; self.rows=[]
            def handle_starttag(self,t,a):
              if t=='tr': self.row=[]
              elif self.row is not None and t in ('td','th'): self.cell=[]
            def handle_data(self,d):
              if self.cell is not None:self.cell.append(d)
            def handle_endtag(self,t):
              if t in ('td','th') and self.cell is not None:
                self.row.append(' '.join(''.join(self.cell).split()));self.cell=None
              elif t=='tr' and self.row is not None:
                if self.row:self.rows.append(self.row)
                self.row=None
          url='https://ds.yublog.com/kotta.php'
          raw=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (DabistaFarmDB)'}),timeout=45).read().decode('utf-8','replace')
          p=P();p.feed(raw)
          def n(s):return unicodedata.normalize('NFKC',s).strip()
          pairs=[];seen=set()
          for r in p.rows:
            if len(r)<2:continue
            a,b=n(r[0]),n(r[1])
            if not a or not b or '種牡馬' in a or '繁殖牝馬' in b:continue
            k=(a,b)
            if k not in seen:seen.add(k);pairs.append({'a':a,'b':b})
          if len(pairs)<100:raise RuntimeError(f'pair table unexpectedly short: {len(pairs)}')
          out={'schemaVersion':1,'source':url,'sourceNote':'湯一路のゲーム内成立確認済み「凝った配合ペア一覧」を正規化。表にない組合せを推測追加しない。','syncedAt':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'count':len(pairs),'pairs':pairs}
          Path('data/kotta-pairs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('pairs',len(pairs))
          PY
      - name: Commit master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kotta-pairs.json
          git commit -m 'Add confirmed elaborate breeding pair master'
          git push
